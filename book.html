<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: makes the page fit phone screens (needed for responsive design). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Description: the short text Google shows under the page title in search results
      (SEO).
    -->
    <meta name="description" content="Book your haircut at Yaya Barber Shop online: pick a service, a barber, a day and a time. Or send us a message.">
    <!-- Title: the name shown on the browser tab. -->
    <title>YBS | Book</title>
    <!--
      Favicons: the small YBS icon on the browser tab (32px and 16px) and on iPhone home
      screens (180px).
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <!--
      Bootstrap 5.3 CSS from a CDN: gives me the grid (row, col), the navbar, buttons
      and spacing classes.
    -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!--
      My own styles. Loaded AFTER Bootstrap so my rules win when both style the same
      thing.
    -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <!--
      Font Awesome kit: gives the icons (scissors, calendar, social logos). Each icon is
      an i tag with a class like fa-solid fa-scissors.
    -->
    <script
      src="https://kit.fontawesome.com/a1428b703b.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!--
      NAVBAR (the same on every page)
      navbar-expand-lg: full menu from laptop size (992px), burger button below that.
      position-absolute top-0 start-0 w-100: the navbar sits on top of the hero photo,
      full width.
      z-3: keeps it above the photo. data-bs-theme="dark": white links and white burger
      icon for a dark background.
    -->
    <nav
      class="navbar navbar-expand-lg position-absolute top-0 start-0 w-100 z-3"
      data-bs-theme="dark"
    >
      <div class="container-fluid">
        <!--
          Logo: the gold YBS text (style.css: .navbar-brand). Clicking it goes back to
          Home.
        -->
        <a class="navbar-brand" href="index.html">YBS</a>
        <!--
          Burger button (phones and tablets). data-bs-target="#navbarNav" points to the
          menu below; Bootstrap JavaScript opens and closes it. aria-label tells screen
          readers what the button does.
        -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!--
          The menu: Bootstrap hides it on small screens and shows it when the burger is
          clicked.
        -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <!--
            ms-auto pushes the links to the right. The link of the current page has
            class "active" and aria-current="page" (tells screen readers which page you
            are on).
          -->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="book.html"
                >Book</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT: everything between the navbar and the footer. -->
    <main>
      <!--
        HERO: same as the Home hero, but the extra class book-hero swaps the photo
        (style.css: #hero.book-hero). No button here because booking is just below.
      -->
      <section
        id="hero"
        class="book-hero d-flex flex-column justify-content-center align-items-center text-center text-white px-3"
      >
        <h1 class="display-3">Book your visit</h1>
        <p class="fst-italic fs-5 mb-4">Choose a service, a day and a time</p>
      </section>

      <!--
        ONLINE BOOKING (Setmore)
        HTML on its own can't save bookings, so I use Setmore (free): it shows the free
        times, lets the customer pick a service and a barber, and sends a confirmation
        email.
        The button below is Setmore's code: id Anywhere_button_iframe and data-booking-
        url (my Setmore page). The Setmore script at the bottom of the page turns it
        into a booking popup. I added btn btn-gold btn-lg so it matches my other
        buttons.
      -->
      <section id="booking" class="py-5 text-center">
        <div class="container">
          <h2 class="section-title">Book online</h2>
          <p class="mt-4">Pick your service, your barber, a day and a time.</p>
          <button
            id="Anywhere_button_iframe"
            class="anywhere-book-now-button btn btn-gold btn-lg"
            data-booking-url="https://moussafieo.setmore.com"
            data-new-tab="false"
          >
            Book now
          </button>
        </div>
      </section>

      <!--
        CONTACT FORM (Web3Forms)
        HTML can't send an email on its own, so the form sends (POST) the fields to
        Web3Forms, a free service that emails them to the shop.
      -->
      <section id="contact" class="py-5">
        <div class="container">
          <h2 class="text-center section-title">Send us a message</h2>
          <form
            action="https://api.web3forms.com/submit"
            method="POST"
            class="col-lg-10 mx-auto mt-4"
          >
            <!--
              Hidden fields (the visitor doesn't see them). access_key tells Web3Forms
              which inbox to send to (it is public by design, safe on GitHub). subject
              is the subject line of the email.
            -->
            <input
              type="hidden"
              name="access_key"
              value="8db98e92-422d-483c-b527-760c602f4d89"
            />
            <input
              type="hidden"
              name="subject"
              value="New message from the YBS website"
            />
            <!--
              Form layout with the Bootstrap grid: col-md-6 = 2 boxes side by side from
              tablet (stacked on phones), col-12 = full width. g-3: space between the
              boxes.
              Each field has: a label for screen readers (visually-hidden hides it on
              screen, screen readers still read it), a name (what shows in the email),
              and required (can't be sent empty).
            -->
            <div class="row g-3">
              <!-- Name -->
              <div class="col-md-6">
                <label for="name" class="visually-hidden">Full name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  class="form-control"
                  placeholder="Full name"
                  required
                />
              </div>
              <!-- Email -->
              <div class="col-md-6">
                <label for="email" class="visually-hidden">Email</label>
                <!-- type="email": the browser checks there is an @ before sending. -->
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  placeholder="Email address"
                  required
                />
              </div>
              <!-- Phone -->
              <div class="col-md-6">
                <label for="phone" class="visually-hidden">Phone number</label>
                <!-- type="tel": phones show the number keypad. -->
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="form-control"
                  placeholder="Phone number"
                  required
                />
              </div>
              <!-- Service -->
              <div class="col-md-6">
                <label for="service" class="visually-hidden">Service</label>
                <!--
                  Dropdown list (optional, no required). form-select = Bootstrap's style
                  for dropdowns.
                -->
                <select id="service" name="service" class="form-select">
                  <option value="" selected>Which service? (optional)</option>
                  <option>Haircut</option>
                  <option>Haircut + beard</option>
                  <option>Beard trim</option>
                  <option>Shave</option>
                  <option>Kids cut</option>
                </select>
              </div>
              <!-- Message -->
              <div class="col-12">
                <label for="message" class="visually-hidden"
                  >Your message</label
                >
                <textarea
                  id="message"
                  name="message"
                  class="form-control"
                  rows="6"
                  placeholder="Message"
                  required
                ></textarea>
              </div>
              <!-- Send button -->
              <div class="col-12 text-center">
                <button type="submit" class="btn btn-gold btn-lg">
                  Send message
                </button>
              </div>
            </div>
          </form>
          <!--
            Contact details: 3 columns from tablet (col-md-4 x 3 = 12 parts), stacked on
            phones. tel: opens the phone app, mailto: opens the email app.
          -->
          <div class="row text-center mt-5 pt-4">
            <div class="col-md-4 mb-4">
              <h3 class="section-title">Phone</h3>
              <p><a href="tel:+442079460123">020 7946 0123</a></p>
            </div>
            <div class="col-md-4 mb-4">
              <h3 class="section-title">Email</h3>
              <p>
                <a href="mailto:hello@ybsbarbers.co.uk"
                  >hello@ybsbarbers.co.uk</a
                >
              </p>
            </div>
            <div class="col-md-4 mb-4">
              <h3 class="section-title">Address</h3>
              <p>12 Garratt Lane,<br />Wandsworth, London SW18</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!--
      FOOTER (the same on every page). bg-dark text-white: dark background, white text.
      text-center py-4: centred, with space above and below.
    -->
    <footer class="bg-dark text-white text-center py-4">
      <!--
        Social links in a row: d-flex puts them side by side, justify-content-center
        centres them, gap-3 adds space between them.
        Each link: target="_blank" opens a new tab, rel="noopener" is a safety rule for
        new tabs, aria-label tells screen readers what the icon is, class social-icon
        draws the gold circle (style.css).
      -->
      <ul class="list-unstyled d-flex justify-content-center gap-3 mb-0">
        <li>
          <a
            href="https://wa.me/447946012300"
            target="_blank"
            rel="noopener"
            aria-label="Message us on WhatsApp (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-whatsapp"></i>
          </a>
        </li>
        <li>
          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>
        </li>
        <li>
          <a
            href="https://www.facebook.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-facebook-f"></i>
          </a>
        </li>
        <li>
          <a
            href="https://www.tiktok.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our TikTok page (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-tiktok"></i>
          </a>
        </li>
      </ul>
    </footer>
    <!--
      Bootstrap JavaScript: makes the burger menu open and close. Placed at the end of
      body so the page content shows first.
    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <!--
      Setmore script: turns the Book now button (id Anywhere_button_iframe) into the
      booking popup. Loaded at the end so the page shows first.
    -->
    <script
      id="anywhere_book_now_script"
      src="https://assets.setmore.com/integration/book-now/live/v1/anywhere-book-now.js"
    ></script>
  </body>
</html>
