<main>
 <!-- Hero: services photo, title and Book now button -->
<section id="hero" class="services-hero d-flex flex-column justify-content-center align-items-center text-center text-white px-3">
    <h1 class="display-3">Services &amp; Prices</h1>
    <p class="fst-italic fs-5 mb-4">Clear prices, no surprises</p>

</section> 

<!-- Services and prices: cards in the Bootstrap grid -->
<section id="prices" class="py-5">
    <div class="container">
        <h2 class="text-center section-title">Our services &amp; prices</h2>
        <div class="row g-4 mt-2">
            <!-- Card 1: Haircut -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="assets/images/haircut.jpg" class="card-img-top" alt="Barber giving a man a haircut">
                    <div class="card-body">
                        <h3 class="card-title">Haircut</h3>
                        <p class="card-text">£20</p>
                     </div>
                </div>
            </div>
                         <!-- Card 2: Haircut + beard -->
                        <div class="col-12 col-md-6 col-lg-4">

                        <h3 class="card-title">Haircut + beard</h3>
                        <p class="card-text">£30</p>
                    </div>
                </div>
            </div>
            <!-- Card 3: Beard trim -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="assets/images/beard-trim.jpg" class="card-img-top" alt="Barber trimming a man's beard">

                        <h3 class="card-title">Beard trim</h3>
                        <p class="card-text">£12</p>
                     </div>
                </div>
            </div>
             <!-- Card 4: Shave -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="assets/images/shave.jpg" class="card-img-top" alt="Barber giving a man a shave">
                    <div class="card-body">
                        <h3 class="card-title">Shave</h3>
                        <p class="card-text">£18</p>
                     </div>
                </div>
            </div>
             <!-- Card 5: Kids cut -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="assets/images/kids-cut.jpg" class="card-img-top" alt="Boy getting a haircut">
                    <div class="card-body">
                        <h3 class="card-title">Kids cut</h3>
                        <p class="card-text">£15</p>
                     </div>
                </div>
            </div>
            
        </div>
