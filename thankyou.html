<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport: makes the page fit phone screens (needed for responsive design). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thank you for your message to Yaya Barber Shop. We'll reply within 24 hours.">
    <!-- Title: the name shown on the browser tab. -->
    <title>YBS | Thank you</title>
    <!--
      Favicons: the small YBS icon on the browser tab (32px and 16px) and on iPhone home
      screens (180px).
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <!--
      Bootstrap 5.3 CSS from a CDN: gives me the grid (row, col), the navbar, buttons
      and spacing classes.
    -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!--
      My own styles. Loaded AFTER Bootstrap so my rules win when both style the same
      thing.
    -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <!--
      Font Awesome kit: gives the icons (scissors, calendar, social logos). Each icon is
      an i tag with a class like fa-solid fa-scissors.
    -->
    <script
      src="https://kit.fontawesome.com/a1428b703b.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!--
      NAVBAR (the same on every page)
      navbar-expand-lg: full menu from laptop size (992px), burger button below that.
      position-absolute top-0 start-0 w-100: the navbar sits on top of the hero photo,
      full width.
      z-3: keeps it above the photo. data-bs-theme="dark": white links and white burger
      icon for a dark background.
    -->
    <nav
      class="navbar navbar-expand-lg position-absolute top-0 start-0 w-100 z-3"
      data-bs-theme="dark"
    >
      <div class="container-fluid">
        <!--
          Logo: the gold YBS text (style.css: .navbar-brand). Clicking it goes back to
          Home.
        -->
        <a class="navbar-brand" href="index.html">YBS</a>
        <!--
          Burger button (phones and tablets). data-bs-target="#navbarNav" points to the
          menu below; Bootstrap JavaScript opens and closes it. aria-label tells screen
          readers what the button does.
        -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!--
          The menu: Bootstrap hides it on small screens and shows it when the burger is
          clicked.
        -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <!--
            ms-auto pushes the links to the right. The link of the current page has
            class "active" and aria-current="page" (tells screen readers which page you
            are on).
          -->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="book.html"
                >Book</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- MAIN CONTENT: everything between the navbar and the footer. -->
    <main>
    <!--
      THANK-YOU MESSAGE: reuses the hero style with the Book page photo (book-hero). The
      2 buttons: d-flex puts them side by side, gap-3 adds space, flex-wrap lets them go
      on 2 lines on small phones. btn-outline-light = Bootstrap's white outline button.
    -->
    <section
      id="hero"
      class="book-hero d-flex flex-column justify-content-center align-items-center text-center text-white px-3"
    >
      <h1 class="display-3">Thank you!</h1>
      <p class="fst-italic fs-5 mb-4">
        Your message has been sent. We'll reply within 24 hours.
      </p>
      <div class="d-flex gap-3 flex-wrap justify-content-center">
        <a href="index.html" class="btn btn-gold btn-lg">Back to home</a>
        <a href="book.html" class="btn btn-outline-light btn-lg">Book online</a>
      </div>
    </section>
    </main>
    <!--
      FOOTER (the same on every page). bg-dark text-white: dark background, white text.
      text-center py-4: centred, with space above and below.
    -->
    <footer class="bg-dark text-white text-center py-4">
      <!--
        Social links in a row: d-flex puts them side by side, justify-content-center
        centres them, gap-3 adds space between them.
        Each link: target="_blank" opens a new tab, rel="noopener" is a safety rule for
        new tabs, aria-label tells screen readers what the icon is, class social-icon
        draws the gold circle (style.css).
      -->
      <ul class="list-unstyled d-flex justify-content-center gap-3 mb-0">
        <li>
          <a
            href="https://wa.me/447946012300"
            target="_blank"
            rel="noopener"
            aria-label="Message us on WhatsApp (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-whatsapp"></i>
          </a>
        </li>
        <li>
          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>
        </li>
        <li>
          <a
            href="https://www.facebook.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-facebook-f"></i>
          </a>
        </li>
        <li>
          <a
            href="https://www.tiktok.com"
            target="_blank"
            rel="noopener"
            aria-label="Visit our TikTok page (opens in a new tab)"
            class="social-icon"
          >
            <i class="fa-brands fa-tiktok"></i>
          </a>
        </li>
      </ul>
    </footer>
    <!--
      Bootstrap JavaScript: makes the burger menu open and close. Placed at the end of
      body so the page content shows first.
    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <!--
      Setmore script: turns the Book now button (id Anywhere_button_iframe) into the
      booking popup. Loaded at the end so the page shows first.
    -->
    <script
      id="anywhere_book_now_script"
      src="https://assets.setmore.com/integration/book-now/live/v1/anywhere-book-now.js"
    ></script>
  </body>
</html>
